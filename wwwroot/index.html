    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

    <link rel="stylesheet" href="css/export-theme.css" />

    <link rel="preload" href="images/hero-bg.png" as="image" fetchpriority="high" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230070a0' width='100' height='100' rx='15'/><text x='50' y='65' font-size='45' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>BFA</text></svg>" />

<body>
    <div id="app">
        <!-- Loading spinner while Blazor loads -->
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p>Caricamento...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Si è verificato un errore. Ricarica la pagina.
        <a href="" class="reload">Ricarica</a>
        <a class="dismiss">🗙</a>
    </div>

	<!-- App Scripts -->
	<script src="js/app.js"></script>
	<script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    
    <style>
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(120deg, rgba(8, 27, 46, 0.96) 0%, rgba(16, 47, 74, 0.78) 52%, rgba(21, 68, 100, 0.34) 100%), url('images/hero-bg.png') center center / cover no-repeat;
            z-index: 9999;
        }
        
        .loading-container p {
            margin-top: 1rem;
            color: rgba(255, 255, 255, 0.92);
            font-size: 0.875rem;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border-radius: 999px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-top-color: rgba(255, 255, 255, 0.95);
            animation: loading-spin 0.8s linear infinite;
        }

        @keyframes loading-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</body>
